const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const msg = document.getElementById('msg');
const go  = document.getElementById('go');

/* One key derivation per attempt, however many recipients exist. The derived
   key is tried against each wrapped content key; whichever unwraps tells us
   both the content key and who is holding this passcode. */
async function unlock(pw){
  const base = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const kek = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(P.s), iterations:P.n, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);

  let raw = null, who = null;
  for(const w of P.w){
    try{
      raw = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(w.v)}, kek, b64(w.k));
      who = w.r; break;
    }catch(_){ /* not this recipient's passcode — keep looking */ }
  }
  if(!raw) throw new Error('no matching passcode');

  const contentKey = await crypto.subtle.importKey(
    'raw', raw, {name:'AES-GCM'}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.i)}, contentKey, b64(P.c));
  const out = new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip')));
  return {html: await out.text(), who};
}

/* Set at build time from LOG_ENDPOINT. Empty means no logging — the email is
   asked for but goes nowhere, because a static file has nowhere to send it. */
const LOG_ENDPOINT = "";

function logAccess(email, who){
  if(!LOG_ENDPOINT) return;
  try{
    fetch(LOG_ENDPOINT, {method:'POST', keepalive:true,
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, recipient:who, document:'BeeOrder CIP'})});
  }catch(_){}
}

/* Access window. Checked before any decryption is attempted. */
const EXPIRES = "2026-10-11";
function expired(){
  const d = new Date(EXPIRES + "T23:59:59Z");
  return isNaN(d) ? false : (Date.now() > d.getTime());
}

  msg.className = 'msg err';
  msg.innerHTML = 'This access link has expired. Please contact ' +

});
